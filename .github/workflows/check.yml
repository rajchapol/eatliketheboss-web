# Builds every branch and pull request, so a broken site is caught before it reaches main.
# With the secret CLOUDFLARE_API_TOKEN set (Settings → Secrets and variables → Actions), it also uploads
# a preview version to Cloudflare and posts the link: job summary, and a comment on the pull request.
#   Token: Cloudflare → My Profile → API Tokens → Create Token → template "Edit Cloudflare Workers".
#   Optional secret CLOUDFLARE_ACCOUNT_ID if the token can see more than one account.
# Production deploys are unchanged: Cloudflare builds main by itself.
name: Check build & preview

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Build with sample content
        run: SANITY_PROJECT_ID=sample npm run build

      - name: Build with live Sanity content
        run: npm run build

      - name: Upload preview to Cloudflare
        id: preview
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          npx --yes wrangler@4 versions upload --preview-alias "$ALIAS" --message "Preview of $BRANCH (${GITHUB_SHA::7})" 2>&1 | tee wrangler.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' wrangler.log | grep -- "^https://$ALIAS-" | head -1)
          [ -n "$URL" ] || URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' wrangler.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview link on the pull request
        if: steps.preview.outputs.url != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- elb-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nCommit ${context.sha.slice(0, 7)} · uses live Sanity content at build time.`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: No Cloudflare token yet
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "Build OK. Add the CLOUDFLARE_API_TOKEN secret to get a preview link." >> "$GITHUB_STEP_SUMMARY"
