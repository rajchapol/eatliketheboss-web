# Builds every branch and pull request (sample content, live Sanity content, Studio schema),
# so a broken site is caught before it reaches main. Production deploys are unchanged: Cloudflare builds main by itself.
name: Check build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Build with sample content
        run: SANITY_PROJECT_ID=sample npm run build

      - name: Build with live Sanity content
        run: npm run build

      - name: Check Sanity Studio schema
        working-directory: studio
        env:
          SANITY_TELEMETRY_DISABLED: '1'
        run: npm ci --no-audit --no-fund && npx sanity schema validate
