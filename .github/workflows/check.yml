# Builds every branch and pull request (sample content, live Sanity content, Lighthouse, Studio schema),
# so a broken site is caught before it reaches main. Production deploys are unchanged: Cloudflare builds main by itself.
name: Check build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true # the runner's cached Node can be older than Astro requires
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Build with sample content
        run: SANITY_PROJECT_ID=sample npm run build

      - name: Build with live Sanity content
        run: npm run build

      # Speed / accessibility / SEO floor on 5 key pages of the live-content build (lighthouserc.cjs).
      # Scores go to the job summary; the step fails only on a big regression (performance < 60, a11y or SEO < 90).
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.cjs
      - name: Lighthouse scores
        if: always()
        run: test -f .lighthouseci/manifest.json && node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

      - name: Check Sanity Studio schema
        working-directory: studio
        env:
          SANITY_TELEMETRY_DISABLED: '1'
        run: npm ci --no-audit --no-fund && npx sanity schema validate
